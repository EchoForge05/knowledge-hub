name: Knowledge checks

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feat/**', 'fix/**', 'docs/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Documents and site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Select npm
        run: npm install --global npm@11.19.1 --ignore-scripts
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - run: npm run check
      - name: Test optional model helper offline
        run: npm run test:ai
      - name: Test manual Issue intake offline
        run: npm run test:issue
      - run: npm run build
      - run: npm run check:site
      - run: npm run build:offline
